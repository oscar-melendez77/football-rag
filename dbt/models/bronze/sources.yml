version: 2

sources:
  - name: bronze
    database: football-rag
    schema: football_bronze
    description: Raw files loaded from the GCS lake, one row per file
    tables:
      - name: raw_files
        description: Raw JSON payloads; source column says which pipeline produced each file

  - name: gold_external
    database: football-rag
    schema: football_gold
    description: Gold tables written outside dbt (by Python jobs)
    tables:
      - name: article_chunks
        description: Article passages with embeddings, written by src/embed_articles.py