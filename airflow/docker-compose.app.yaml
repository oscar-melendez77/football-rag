services:
  assistant:
    build: .
    image: football-rag-assistant
    entrypoint: ["/opt/airflow/ml-venv/bin/uvicorn"]
    command: ["api:app", "--app-dir", "/opt/airflow/project/src", "--host", "0.0.0.0", "--port", "8000"]
    working_dir: /opt/airflow/project
    env_file: .env
    user: "${AIRFLOW_UID:-50000}:0"
    volumes:
      - ../src:/opt/airflow/project/src
      - ../models:/opt/airflow/models
      - ./secrets:/opt/airflow/secrets:ro
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s